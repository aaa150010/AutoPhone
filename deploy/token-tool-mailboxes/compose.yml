services:
  token-tool-mailboxes:
    build: .
    container_name: token-tool-mailboxes
    restart: unless-stopped
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - /opt/token-tool-mailboxes-data:/data
    networks:
      - note_default
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/token-tool/api/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  note_default:
    external: true
